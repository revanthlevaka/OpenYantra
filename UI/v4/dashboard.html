<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>OpenYantra v4.0.0 -- Briefing Room</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,300;0,400;0,500;0,600;1,300&family=IBM+Plex+Sans:wght@300;400;500&display=swap');

:root, [data-theme="dark"] {
  --ink:        #0a0a0b;
  --surface:    #111113;
  --surface2:   #161618;
  --surface3:   #1c1b1f;
  --border:     rgba(255,255,255,0.07);
  --border2:    rgba(255,255,255,0.12);
  --dim:        #242228;
  --muted:      #524f58;
  --subtle:     #7a7682;
  --text:       #e8e5de;
  --text-dim:   rgba(232,229,222,0.55);
  --grid-line:  rgba(255,255,255,0.018);
  --nav-bg:     rgba(10,10,11,0.9);
  --term-bg:    #080809;
  --term-body:  #060607;
  --card-item:  rgba(255,255,255,0.03);
  --hover-row:  rgba(255,255,255,0.02);
  --scrollbar:  #242228;
}
[data-theme="light"] {
  --ink:        #f3f1ec;
  --surface:    #ffffff;
  --surface2:   #ece9e2;
  --surface3:   #e4e0d8;
  --border:     rgba(0,0,0,0.09);
  --border2:    rgba(0,0,0,0.16);
  --dim:        #d0ccc4;
  --muted:      #888380;
  --subtle:     #555250;
  --text:       #1a1820;
  --text-dim:   rgba(26,24,32,0.56);
  --grid-line:  rgba(0,0,0,0.04);
  --nav-bg:     rgba(243,241,236,0.93);
  --term-bg:    #1a1820;
  --term-body:  #141218;
  --card-item:  rgba(0,0,0,0.025);
  --hover-row:  rgba(0,0,0,0.018);
  --scrollbar:  #d0ccc4;
}
:root {
  --blue:    #1c6fff;
  --indigo:  #5535e0;
  --coral:   #e84520;
  --amber:   #f5a000;
  --green:   #1aa167;
  --grad:    linear-gradient(135deg,#1c6fff 0%,#5535e0 32%,#e84520 66%,#f5a000 100%);
  --grad-h:  linear-gradient(90deg,#1c6fff 0%,#5535e0 32%,#e84520 66%,#f5a000 100%);
  --grad-t:  linear-gradient(135deg,#1c6fff,#5535e0 40%,#e84520 70%,#f5a000);
  --mono:    'IBM Plex Mono', monospace;
  --sans:    'IBM Plex Sans', sans-serif;
  --ease:    cubic-bezier(0.16,1,0.3,1);
  --tr:      background 0.28s,color 0.28s,border-color 0.28s,box-shadow 0.28s;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{
  background:var(--ink);color:var(--text);
  font-family:var(--mono);font-size:13px;line-height:1.6;
  transition:var(--tr);
}
body::before{
  content:'';position:fixed;inset:0;z-index:0;
  background-image:linear-gradient(var(--grid-line) 1px,transparent 1px),
    linear-gradient(90deg,var(--grid-line) 1px,transparent 1px);
  background-size:40px 40px;pointer-events:none;transition:var(--tr);
}
a{color:inherit;text-decoration:none;}
button{font-family:var(--mono);cursor:pointer;transition:var(--tr);}
input, select, textarea { transition:var(--tr); }
::-webkit-scrollbar{width:3px;}::-webkit-scrollbar-track{background:var(--ink);}::-webkit-scrollbar-thumb{background:var(--scrollbar);}
.grad-text{background:var(--grad-t);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}

header{position:fixed;top:0;left:0;right:0;z-index:100;height:52px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;background:var(--nav-bg);backdrop-filter:blur(16px);border-bottom:1px solid var(--border);transition:var(--tr);}
header::after{content:'';position:absolute;bottom:0;left:0;right:0;height:2px;background:var(--grad-h);}
.hdr-l{display:flex;align-items:center;gap:10px;font-size:12px;font-weight:500;letter-spacing:0.06em;}
.hdr-mark{width:22px;height:22px;animation:spin 90s linear infinite;flex-shrink:0;transform-origin:center;}
@keyframes spin{to{transform:rotate(360deg);}}
.hdr-badge{font-size:9px;letter-spacing:0.12em;text-transform:uppercase;padding:3px 8px;border:1px solid var(--border2);color:var(--muted);margin-left:6px;transition:var(--tr);}
.hdr-r{display:flex;align-items:center;gap:10px;}
.status-dot{width:6px;height:6px;border-radius:50%;background:var(--green);animation:pulse 2.4s ease-in-out infinite;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:0.3;}}
.theme-row{display:flex;background:var(--surface);border:1px solid var(--border);padding:2px;gap:1px;transition:var(--tr);}
.th-btn{font-family:var(--mono);font-size:8px;letter-spacing:0.1em;text-transform:uppercase;padding:4px 8px;background:transparent;border:none;color:var(--muted);cursor:pointer;transition:var(--tr);display:inline-flex;align-items:center;gap:3px;}
.th-btn:hover{color:var(--text);}
.th-btn.active{background:var(--dim);color:var(--text);}

nav{position:fixed;top:52px;left:0;bottom:0;width:200px;z-index:99;background:var(--surface);border-right:1px solid var(--border);border-bottom:none;display:flex;flex-direction:column;gap:0;overflow-y:auto;overflow-x:hidden;transition:var(--tr), width 0.28s var(--ease);}
nav::-webkit-scrollbar{width:2px;}
.ntab{font-family:var(--mono);font-size:10px;letter-spacing:0.12em;text-transform:uppercase;padding:14px 20px;background:transparent;border:none;border-bottom:1px solid var(--border);border-right:none;color:var(--muted);cursor:pointer;white-space:nowrap;display:flex;align-items:center;gap:12px;width:100%;text-align:left;transition:var(--tr);}
.ntab span{transition:opacity 0.28s var(--ease), width 0.28s var(--ease);}
.ntab:hover{color:var(--text);background:var(--surface2);}
.ntab.active{color:var(--text);border-left:3px solid var(--amber);background:var(--surface2);padding-left:17px;}

main{margin-top:52px;padding:24px;margin-left:200px;padding-bottom:80px;position:relative;z-index:1;transition:margin-left 0.28s var(--ease);}

/* Collapsed Sidebar overrides */
body.sidebar-collapsed nav{width:60px;}
body.sidebar-collapsed .ntab span{opacity:0;pointer-events:none;width:0;display:none;}
body.sidebar-collapsed .ntab{padding:14px 0;justify-content:center;}
body.sidebar-collapsed .ntab.active{padding-left:0;border-left:3px solid var(--amber);}
body.sidebar-collapsed main{margin-left:60px;}

/* Responsive adjustments */
@media(max-width:768px){
  nav{width:60px;}
  main{margin-left:60px;padding:16px;}
  body.sidebar-collapsed nav{width:0;border-right:none;}
  body.sidebar-collapsed main{margin-left:0;}
}
.pane{display:none;}
.pane.active{display:block;}

/* Cards */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin-bottom:18px;}
.card{background:var(--surface2);border:1px solid var(--border);padding:13px;cursor:pointer;transition:var(--tr), border-color 0.15s;}
.card:hover{border-color:rgba(255,153,51,0.4);}
.card.warn{border-color:rgba(245,160,0,0.35);}
.card.alert{border-color:rgba(232,69,32,0.35);}
.cn{font-size:1.8rem;font-weight:300;line-height:1;margin-bottom:4px;}
.ck{font-size:8px;letter-spacing:0.14em;text-transform:uppercase;color:var(--muted);}

/* Section header */
.sh{font-size:9px;letter-spacing:0.22em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:12px;margin:16px 0 10px;}
.sh::after{content:'';flex:1;height:1px;background:var(--border);transition:var(--tr);}

/* Table */
table{width:100%;border-collapse:collapse;font-size:11px;}
th{background:var(--surface2);color:var(--muted);padding:7px 10px;text-align:left;font-weight:400;border-bottom:1px solid var(--border);font-size:9px;letter-spacing:0.1em;text-transform:uppercase;transition:var(--tr);}
td{padding:6px 10px;border-bottom:1px solid var(--border);max-width:240px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;transition:var(--tr);}
tr:hover td{background:var(--surface2);}
.badge{display:inline-block;font-size:8px;letter-spacing:0.08em;padding:2px 7px;border:1px solid;transition:var(--tr);}
.b-ok{border-color:rgba(26,161,103,0.35);color:var(--green);}
.b-hi{border-color:rgba(232,69,32,0.35);color:var(--coral);}
.b-md{border-color:rgba(245,160,0,0.35);color:var(--amber);}
.b-lo{border-color:rgba(28,111,255,0.35);color:var(--blue);}

/* Ts-card (Today) */
.ts-card{background:var(--surface2);border:1px solid var(--border);padding:13px;margin-bottom:10px;position:relative;overflow:hidden;transition:var(--tr);}
.ts-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:var(--grad);}
.ts-card h3{font-size:10px;letter-spacing:0.1em;text-transform:uppercase;color:var(--amber);margin-bottom:10px;}
.ti{display:flex;align-items:flex-start;gap:10px;padding:7px 0;border-bottom:1px solid var(--border);transition:var(--tr);}
.ti:last-child{border-bottom:none;}
.ti-pri{min-width:52px;font-size:8px;text-align:center;letter-spacing:0.08em;}
.ti-con{flex:1;font-size:11px;}
.ti-con small{color:var(--muted);font-size:10px;display:block;margin-top:2px;}
.ti-act button{background:transparent;border:1px solid var(--border);color:var(--muted);padding:3px 8px;font-family:var(--mono);font-size:9px;cursor:pointer;transition:var(--tr);}
.ti-act button:hover{border-color:var(--amber);color:var(--amber);}

/* Oracle card */
.oracle-card{background:linear-gradient(135deg,#0e1628,#161830);border:1px solid rgba(28,111,255,0.25);padding:14px 18px;margin-bottom:12px;transition:var(--tr);}
.oracle-card-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
.oracle-card-title{font-size:11px;font-weight:500;color:var(--blue);letter-spacing:0.04em;}
.oracle-item{padding:7px 0;border-bottom:1px solid rgba(255,255,255,0.04);transition:var(--tr);}
.oracle-item:last-child{border-bottom:none;}
.oracle-type{font-size:8px;letter-spacing:0.12em;text-transform:uppercase;margin-bottom:2px;}
.oracle-detail{font-size:10px;color:var(--text-dim);}
.oracle-action{font-size:9px;color:var(--blue);margin-top:2px;}

/* Insight card (morning brief) */
.insight-card{background:linear-gradient(135deg,#1e1630,#241832);border:1px solid rgba(255,153,51,0.25);padding:14px 18px;margin-bottom:12px;}

/* Inbox */
.ibf{display:flex;gap:8px;margin-bottom:12px;}
.ibf input{flex:1;background:var(--surface2);border:1px solid var(--border);color:var(--text);padding:8px 12px;font-family:var(--mono);font-size:12px;outline:none;}
.ibf input:focus{border-color:var(--amber);}
.btn-p{background:var(--grad);color:#fff;border:none;padding:8px 18px;font-family:var(--mono);font-size:10px;letter-spacing:0.12em;text-transform:uppercase;cursor:pointer;}
.btn-p:hover{opacity:0.88;}
.btn{background:var(--surface2);border:1px solid var(--border);color:var(--text);padding:8px 14px;font-family:var(--mono);font-size:10px;letter-spacing:0.1em;text-transform:uppercase;cursor:pointer;}
.btn:hover{border-color:var(--amber);}
.btn-ok{border-color:rgba(26,161,103,0.4);color:var(--green);}
.btn-x{border-color:rgba(232,69,32,0.4);color:var(--coral);}

/* Timeline */
.tl{position:relative;padding-left:20px;}
.tl::before{content:'';position:absolute;left:6px;top:0;bottom:0;width:2px;background:var(--border);}
.tli{position:relative;margin-bottom:10px;}
.tli::before{content:'';position:absolute;left:-16px;top:5px;width:7px;height:7px;border-radius:50%;background:var(--amber);border:2px solid var(--ink);}
.tl-ts{font-size:9px;color:var(--muted);margin-bottom:2px;}
.tl-body{background:var(--surface2);border:1px solid var(--border);padding:7px 11px;font-size:11px;}
.tl-ag{color:var(--amber);font-size:9px;margin-bottom:2px;}

/* Health grid */
.hgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px;}
.hi{background:var(--surface2);border:1px solid var(--border);padding:10px 14px;display:flex;justify-content:space-between;align-items:center;}
.hi-k{font-size:9px;letter-spacing:0.08em;color:var(--muted);}
.hi-v{font-size:13px;font-weight:500;}
.hi-v.ok{color:var(--green);}.hi-v.warn{color:var(--amber);}

/* Security */
.sec-clean{background:rgba(26,161,103,0.07);border:1px solid rgba(26,161,103,0.25);padding:12px 16px;margin-bottom:14px;font-size:11px;color:var(--green);}
.q-item{background:var(--surface2);border:1px solid rgba(232,69,32,0.25);padding:10px 14px;margin-bottom:8px;}
.q-type{font-size:9px;letter-spacing:0.1em;text-transform:uppercase;color:var(--coral);margin-bottom:4px;}

/* Copy context */
.ctx-btn{display:flex;align-items:center;gap:12px;margin-bottom:14px;}
.ctx-hint{font-size:10px;color:var(--muted);}

/* Float capture */
#fcap{position:fixed;bottom:20px;right:20px;z-index:200;}
#fbtn{background:var(--amber);color:var(--ink);border:none;width:48px;height:48px;border-radius:50%;font-size:1.4rem;font-weight:700;box-shadow:0 4px 16px rgba(245,160,0,0.4);}
#fbtn:hover{transform:scale(1.08);}
#fform{display:none;position:absolute;bottom:56px;right:0;background:var(--surface);border:1px solid var(--amber);padding:12px;width:260px;box-shadow:0 8px 24px rgba(0,0,0,0.5);}
#fform.open{display:block;}
#fform p{font-size:9px;color:var(--muted);margin-bottom:6px;letter-spacing:0.1em;}
#finput{width:100%;background:var(--surface2);border:1px solid var(--border);color:var(--text);padding:7px;font-family:var(--mono);font-size:11px;margin-bottom:7px;resize:none;height:54px;outline:none;}
#finput:focus{border-color:var(--amber);}
.fbrow{display:flex;gap:6px;}

/* Toast */
#toast{position:fixed;bottom:76px;right:22px;background:var(--surface);border:1px solid var(--green);color:var(--green);padding:8px 14px;font-size:10px;display:none;z-index:300;}

.empty{color:var(--muted);text-align:center;padding:24px;font-size:11px;}

@media(max-width:600px){nav{gap:0;}main{padding:12px;}.cards{grid-template-columns:repeat(2,1fr);}}

/* Modal Styles */
.modal-overlay {
  position: fixed; top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.85); z-index: 1000;
  display: none; align-items: center; justify-content: center;
  backdrop-filter: blur(4px);
}
.modal-overlay.open { display: flex; }
.modal-card {
  background: var(--surface); border: 1px solid var(--border2);
  width: 500px; max-width: 95vw; padding: 20px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.8); position: relative;
}
.modal-card::before {
  content: ''; position: absolute; top:0; left:0; right:0; height:2px; background: var(--grad);
}
.modal-card h3 {
  font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--amber); margin-bottom: 15px;
}
.form-group { margin-bottom: 12px; }
.form-group label {
  display: block; font-size: 9px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); margin-bottom: 4px;
}
.form-group input, .form-group select, .form-group textarea {
  width: 100%; background: var(--surface2); border: 1px solid var(--border); color: var(--text); padding: 8px; font-family: var(--mono); font-size: 11px; outline: none;
}
.form-group input:focus, .form-group select:focus, .form-group textarea:focus { border-color: var(--amber); }

/* Hierarchy & Graph Node Styles */
.level-row {
  display: flex; justify-content: space-around; align-items: center; width: 100%; min-height: 80px;
}
.agent-node {
  background: var(--surface2); border: 1px solid var(--border); padding: 10px 16px; cursor: pointer; text-align: center; min-width: 130px; z-index: 2; position: relative; transition: border-color 0.2s;
}
.agent-node:hover {
  border-color: var(--blue);
}
.agent-node.selected {
  border-color: var(--amber); box-shadow: 0 0 10px rgba(245,160,0,0.2);
}
</style>
</head>
<body>

<header>
  <div class="hdr-l">
    <svg class="hdr-mark" width="22" height="22" viewBox="0 0 100 100" fill="none">
      <defs>
        <linearGradient id="hG" x1="0" y1="0" x2="100" y2="100" gradientUnits="userSpaceOnUse">
          <stop offset="0%" stop-color="#1c6fff"/>
          <stop offset="33%" stop-color="#5535e0"/>
          <stop offset="66%" stop-color="#e84520"/>
          <stop offset="100%" stop-color="#f5a000"/>
        </linearGradient>
      </defs>
      <circle cx="50" cy="50" r="47" stroke="url(#hG)" stroke-width="1.5" fill="none"/>
      <circle cx="50" cy="50" r="33" stroke="url(#hG)" stroke-width="1" fill="none" opacity="0.5"/>
      <circle cx="50" cy="50" r="18" stroke="url(#hG)" stroke-width="0.8" fill="none" opacity="0.3"/>
      <circle cx="50" cy="50" r="4" fill="url(#hG)"/>
      <line x1="50" y1="3" x2="50" y2="97" stroke="url(#hG)" stroke-width="0.6" opacity="0.18"/>
      <line x1="3" y1="50" x2="97" y2="50" stroke="url(#hG)" stroke-width="0.6" opacity="0.18"/>
      <circle cx="50" cy="3" r="3" fill="#1c6fff"/>
      <circle cx="97" cy="50" r="3" fill="#5535e0"/>
      <circle cx="50" cy="97" r="3" fill="#e84520"/>
      <circle cx="3" cy="50" r="3" fill="#f5a000"/>
      <path d="M50 3 Q68 26 50 50 Q32 26 50 3" stroke="url(#hG)" stroke-width="0.9" fill="none" opacity="0.42"/>
      <path d="M97 50 Q74 68 50 50 Q74 32 97 50" stroke="url(#hG)" stroke-width="0.9" fill="none" opacity="0.42"/>
      <path d="M50 97 Q32 74 50 50 Q68 74 50 97" stroke="url(#hG)" stroke-width="0.9" fill="none" opacity="0.42"/>
      <path d="M3 50 Q26 32 50 50 Q26 68 3 50" stroke="url(#hG)" stroke-width="0.9" fill="none" opacity="0.42"/>
    </svg>
    <button id="sidebarToggle" style="background:none; border:none; color:var(--muted); cursor:pointer; padding:4px; display:inline-flex; align-items:center; transition:var(--tr); margin-left: 2px;" title="Toggle Sidebar">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><line x1="9" y1="3" x2="9" y2="21"/></svg>
    </button>
    OpenYantra
    <span class="hdr-badge">v4.0.0</span>
  </div>
  <div class="hdr-r">
    <span style="display:flex;align-items:center;gap:5px;font-size:10px;color:var(--green)"><span class="status-dot"></span>Chitragupta active</span>
    <div class="theme-row" id="tr">
      <button class="th-btn" data-mode="light">
        <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
        Light
      </button>
      <button class="th-btn" data-mode="dark">
        <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        Dark
      </button>
      <button class="th-btn" data-mode="auto">
        <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 3v9l4 4"/></svg>
        Auto
      </button>
    </div>
  </div>
</header>

<nav>
  <button class="ntab active" onclick="go('today',this)">🌅 <span>Today</span></button>
  <button class="ntab" onclick="go('inbox',this)">📥 <span>Inbox</span></button>
  <button class="ntab" onclick="go('loops',this)">🔓 <span>Loops</span></button>
  <button class="ntab" onclick="go('projects',this)">🚀 <span>Projects</span></button>
  <button class="ntab" onclick="go('oracle',this)">🔮 <span>Oracle</span></button>
  <button class="ntab" onclick="go('review',this)">✏️ <span>Review</span></button>
  <button class="ntab" onclick="go('timeline',this)">📅 <span>Timeline</span></button>
  <button class="ntab" onclick="go('security',this)">🔒 <span>Security</span></button>
  <button class="ntab" onclick="go('ledger',this)">📒 <span>Ledger</span></button>
  <button class="ntab" onclick="go('health',this)">💚 <span>Health</span></button>
  <button class="ntab" onclick="go('cognitive_memories',this)">🧠 <span>Memories</span></button>
  <button class="ntab" onclick="go('cognitive_hierarchy',this)">👥 <span>Hierarchy</span></button>
  <button class="ntab" onclick="go('cognitive_graph',this)">🕸️ <span>Graph</span></button>
  <button class="ntab" onclick="go('config_settings',this)">⚙️ <span>Settings</span></button>
</nav>

<main>
  <div id="today" class="pane active"></div>
  <div id="inbox" class="pane"></div>
  <div id="loops" class="pane"></div>
  <div id="projects" class="pane"></div>
  <div id="oracle" class="pane"></div>
  <div id="review" class="pane"></div>
  <div id="timeline" class="pane"></div>
  <div id="security" class="pane"></div>
  <div id="ledger" class="pane"></div>
  <div id="health" class="pane"></div>
  <div id="cognitive_memories" class="pane"></div>
  <div id="cognitive_hierarchy" class="pane"></div>
  <div id="cognitive_graph" class="pane"></div>
  <div id="config_settings" class="pane"></div>
</main>

<div id="fcap">
  <div id="fform">
    <p>QUICK CAPTURE -- INBOX</p>
    <textarea id="finput" placeholder="Capture anything..."></textarea>
    <div class="fbrow">
      <button class="btn-p" onclick="floatSave()" style="flex:1">Save</button>
      <button class="btn" onclick="floatClose()">X</button>
    </div>
  </div>
  <button id="fbtn" onclick="floatToggle()" title="Quick capture (i)">+</button>
</div>
<div id="toast"></div>

<script>
const api = async(url,opts={})=>{try{const r=await fetch(url,opts);return await r.json();}catch(e){return{};}};
const toast = (m,ok=true)=>{const t=document.getElementById('toast');t.textContent=m;t.style.borderColor=ok?'var(--green)':'var(--coral)';t.style.color=ok?'var(--green)':'var(--coral)';t.style.display='block';setTimeout(()=>t.style.display='none',2500);};
const ptag = s=>{if(!s)return'';const m={'Active':'b-ok','Pending':'b-md','High':'b-hi','Critical':'b-hi','Medium':'b-md','Low':'b-lo','Done':'b-lo','written':'b-ok','confirmed':'b-hi','suspicious':'b-md','clean':'b-ok'};return`<span class="badge ${m[s]||''}">${s}</span>`;};
const tbl = (rows,cols)=>{
  if(!rows||!rows.length)return'<div class="empty">No data yet.</div>';
  let h='<table><tr>'+cols.map(c=>`<th>${c}</th>`).join('')+'</tr>';
  rows.forEach(r=>{h+='<tr>'+cols.map(c=>{const v=String(r[c]||'');if(['Status','Priority','Threat Level'].includes(c))return`<td>${ptag(v)}</td>`;return`<td title="${v}">${v.substring(0,55)}</td>`;}).join('')+'</tr>';});
  return h+'</table>';
};

let cur='today';
function go(name,btn){
  document.querySelectorAll('.pane').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.ntab').forEach(b=>b.classList.remove('active'));
  document.getElementById(name).classList.add('active');
  if(btn)btn.classList.add('active');
  cur=name; load(name);
}

async function load(name){
  const L={today:loadToday,inbox:loadInbox,loops:loadLoops,
    projects:()=>loadTable('projects',['Project','Domain','Status','Priority','Next Step'],'projects'),
    oracle:loadOracle,review:loadReview,timeline:loadTimeline,
    security:loadSecurity,ledger:()=>loadTable('ledger',['Timestamp','Agent','Sheet','Operation','Status'],'ledger'),
    health:loadHealth,
    cognitive_memories:loadCognitiveMemories,
    cognitive_hierarchy:loadCognitiveHierarchy,
    cognitive_graph:loadCognitiveGraph,
    config_settings:loadConfigSettings};
  if(L[name])await L[name]();
}

async function loadToday(){
  const [h,ld,pd,td,id,od]=await Promise.all([
    api('/api/health'),api('/api/sheet/open_loops'),api('/api/sheet/projects'),
    api('/api/sheet/tasks'),api('/api/sheet/inbox'),api('/api/oracle')
  ]);
  const cards=[
    {n:h.open_loops||0,k:'Open Loops',c:(h.open_loops||0)>10?'warn':''},
    {n:h.inbox_pending||0,k:'Inbox',c:(h.inbox_pending||0)>0?'warn':''},
    {n:h.corrections_pending||0,k:'Corrections',c:(h.corrections_pending||0)>0?'warn':''},
    {n:h.stale_projects||0,k:'Stale Projects',c:(h.stale_projects||0)>0?'alert':''},
  ].map(c=>`<div class="card ${c.c}" onclick="goTo('${c.k.toLowerCase().replace(' ','')}')"><div class="cn" style="color:var(--amber)">${c.n}</div><div class="ck">${c.k}</div></div>`).join('');

  // Copy context button
  const ctxBtn=`<div class="ctx-btn"><button class="btn-p" onclick="copyCtx()">📋 Copy Context</button><span class="ctx-hint">Paste into Claude.ai, ChatGPT, or any AI chat</span></div>`;

  // Morning brief card
  const brief=await api('/api/morning');
  let briefCard='';
  if(brief&&brief.brief){
    const bHtml=brief.brief.replace(/\*\*(.*?)\*\*/g,'<strong style="color:var(--amber)">$1</strong>').replace(/\*(.*?)\*/g,'<em style="color:var(--muted)">$1</em>').replace(/^##.*$/gm,'').split('\n').filter(l=>l.trim()).join('<br>');
    briefCard=`<div class="insight-card"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px"><span style="color:var(--amber);font-size:11px;font-weight:500">🌅 Morning Brief</span>${brief.streak>0?`<span style="color:var(--coral);font-size:10px">🔥 ${brief.streak}d streak</span>`:''}</div><div style="color:var(--text-dim);font-family:var(--sans);font-size:12px;line-height:1.7">${bHtml}</div></div>`;
  }

  // Oracle card
  let oCard='';
  if(od&&od.count>0){
    let oItems=od.insights.slice(0,3).map(ins=>{
      const tc={'inbox_loop_match':'var(--amber)','task_loop_block':'var(--coral)','belief_conflict':'var(--amber)','stale_project':'var(--blue)','person_missing':'var(--green)','loop_aging':'var(--coral)','orphan_task':'var(--muted)'}[ins.type]||'var(--muted)';
      return`<div class="oracle-item"><div class="oracle-type" style="color:${tc}">${ins.type}</div><div class="oracle-detail">${ins.detail.substring(0,90)}</div><div class="oracle-action">-- ${ins.action.substring(0,65)}</div></div>`;
    }).join('');
    oCard=`<div class="oracle-card" id="oracle-card"><div class="oracle-card-head"><span class="oracle-card-title">🔮 Oracle -- ${od.count} insight${od.count!==1?'s':''}</span><button class="btn" style="font-size:9px;padding:4px 10px" onclick="goTo('oracle')">All</button></div>${oItems}</div>`;
  }

  // Urgent items
  const cutoff=new Date(Date.now()-7*86400000).toISOString().slice(0,10);
  const loops=(ld.rows||[]).filter(r=>r['Resolved?']==='No').sort((a,b)=>(b['Importance']||5)-(a['Importance']||5)).slice(0,4);
  const stale=(pd.rows||[]).filter(r=>r['Status']==='Active'&&(r['Last Updated']||'')<cutoff).slice(0,3);
  const uTasks=(td.rows||[]).filter(r=>r['Status']==='Pending'&&r['Priority']==='High').slice(0,3);
  const inbox=(id.rows||[]).filter(r=>r['Routed?']==='No').slice(0,3);

  let body='';
  if(loops.length){
    body+='<div class="ts-card"><h3>Open Loops -- Needing Attention</h3>';
    loops.forEach(l=>{body+=`<div class="ti"><div class="ti-pri">${ptag(l['Priority']||'?')}</div><div class="ti-con">${(l['Topic']||'').substring(0,60)}<small>${(l["Context / What's Unresolved"]||'').substring(0,70)}</small></div><div class="ti-act"><button onclick="resolveLoop('${(l['Topic']||'').replace(/'/g,"\\'")}')">Resolve</button></div></div>`;});
    body+='</div>';
  }
  if(stale.length){
    body+='<div class="ts-card"><h3>Stale Projects -- No Update 7+ Days</h3>';
    stale.forEach(p=>{body+=`<div class="ti"><div class="ti-pri">${ptag(p['Priority']||'?')}</div><div class="ti-con">${(p['Project']||'').substring(0,55)}<small>Next: ${(p['Next Step']||'not set').substring(0,60)}</small></div><div class="ti-act"><button onclick="goTo('projects')">View</button></div></div>`;});
    body+='</div>';
  }
  if(uTasks.length){
    body+='<div class="ts-card"><h3>High Priority Tasks</h3>';
    uTasks.forEach(t=>{body+=`<div class="ti"><div class="ti-pri">${ptag('High')}</div><div class="ti-con">${(t['Task']||'').substring(0,60)}<small>${t['Project']||''}</small></div><div class="ti-act"><button onclick="doneTask('${(t['Task']||'').replace(/'/g,"\\'")}')">Done</button></div></div>`;});
    body+='</div>';
  }
  if(inbox.length){
    body+=`<div class="ts-card"><h3>Inbox -- ${inbox.length} Items Need Routing</h3>`;
    inbox.forEach(i=>{body+=`<div class="ti"><div class="ti-pri" style="color:var(--muted);font-size:9px">Inbox</div><div class="ti-con">${(i['Content']||'').substring(0,75)}</div><div class="ti-act"><button onclick="routeAll()">Route All</button></div></div>`;});
    body+='</div>';
  }
  if(!body)body='<div class="ts-card"><h3 style="color:var(--green)">All clear -- nothing urgent today</h3></div>';

  document.getElementById('today').innerHTML='<div class="cards">'+cards+'</div>'+briefCard+oCard+ctxBtn+body;
}

async function loadOracle(){
  const od=await api('/api/oracle');
  const el=document.getElementById('oracle');
  if(!od||od.count===0){el.innerHTML='<div class="sh"><span>Oracle</span></div><div class="empty">Nothing to surface today -- all memory connections look healthy.</div>';return;}
  const typeColor={'inbox_loop_match':'var(--amber)','task_loop_block':'var(--coral)','belief_conflict':'var(--amber)','stale_project':'var(--blue)','person_missing':'var(--green)','loop_aging':'var(--coral)','orphan_task':'var(--muted)'};
  let html=`<div class="sh"><span>Oracle -- ${od.count} Insight${od.count!==1?'s':''}</span></div>`;
  html+='<p style="font-family:var(--sans);font-size:12px;color:var(--text-dim);margin-bottom:16px">Cross-reference engine -- read-only, never writes. Surfaces non-obvious connections across all sheets.</p>';
  od.insights.forEach((ins,i)=>{
    const tc=typeColor[ins.type]||'var(--muted)';
    html+=`<div style="background:var(--surface2);border:1px solid var(--border);border-left:3px solid ${tc};padding:12px 16px;margin-bottom:8px">
      <div style="font-size:9px;letter-spacing:0.12em;text-transform:uppercase;color:${tc};margin-bottom:5px">${i+1}. ${ins.type}</div>
      <div style="font-size:12px;font-weight:500;margin-bottom:4px">${ins.title}</div>
      <div style="font-size:11px;color:var(--text-dim);margin-bottom:6px">${ins.detail}</div>
      <div style="font-size:10px;color:var(--blue)">Action: ${ins.action}</div>
    </div>`;
  });
  el.innerHTML=html;
}

async function loadInbox(){
  const d=await api('/api/sheet/inbox');
  const rows=(d.rows||[]).filter(r=>r['Routed?']==='No');
  let html=`<div class="sh"><span>Inbox -- Quick Capture</span></div>`;
  html+=`<div class="ibf"><input id="ii" placeholder="Capture a thought..."/><button class="btn-p" onclick="saveInbox()">Save</button></div>`;
  html+=tbl(rows,['Content','Captured','Importance','Source']);
  if(rows.length)html+=`<br><button class="btn btn-ok" onclick="routeAll()">Route All (${rows.length} items)</button>`;
  document.getElementById('inbox').innerHTML=html;
}

async function loadLoops(){
  const d=await api('/api/sheet/open_loops');
  const open=(d.rows||[]).filter(r=>r['Resolved?']==='No');
  document.getElementById('loops').innerHTML='<div class="sh"><span>Open Loops (Anishtha)</span></div>'+tbl(open,['Topic',"Context / What's Unresolved",'Priority','Importance','Opened','TTL_Days']);
}

async function loadTable(sheet,cols,elId){
  const d=await api(`/api/sheet/${sheet}`);
  document.getElementById(elId).innerHTML='<div class="sh"><span>'+sheet+'</span></div>'+tbl(d.rows||[],cols);
}

async function loadReview(){
  const d=await api('/api/sheet/corrections');
  const pending=(d.rows||[]).filter(r=>r['Status']==='Pending');
  const el=document.getElementById('review');
  if(!pending.length){el.innerHTML='<div class="sh"><span>Review (Corrections + Conflicts)</span></div><div class="empty">Nothing pending approval.</div>';return;}
  let html='<div class="sh"><span>Corrections Pending Approval</span></div>';
  html+='<p style="font-family:var(--sans);font-size:12px;color:var(--text-dim);margin-bottom:14px">Your choice is Dharma-Adesh -- it always wins.</p>';
  pending.forEach((c,i)=>{
    html+=`<div style="background:var(--surface2);border:1px solid rgba(245,160,0,0.25);padding:13px;margin-bottom:10px">
      <div style="font-size:10px;color:var(--amber);margin-bottom:8px">${c['Target Sheet']||'?'} -- ${c['Row Identifier']||'?'} -- ${c['Field']||'?'}</div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px">
        <div style="background:rgba(245,160,0,0.07);border:1px solid rgba(245,160,0,0.2);padding:10px"><div style="font-size:9px;color:var(--amber);margin-bottom:3px">Agent proposes</div><div style="font-size:12px">${c['Proposed Value']||'?'}</div></div>
        <div style="background:rgba(26,161,103,0.07);border:1px solid rgba(26,161,103,0.2);padding:10px"><div style="font-size:9px;color:var(--green);margin-bottom:3px">Your version (current)</div><div style="font-size:12px;color:var(--muted)">--</div></div>
      </div>
      <div style="display:flex;gap:8px">
        <button class="btn btn-ok" onclick="revC(${i},'Approved')">Accept change</button>
        <button class="btn btn-x" onclick="revC(${i},'Rejected')">Keep mine</button>
      </div>
    </div>`;
  });
  el.innerHTML=html;
}

async function loadTimeline(){
  const d=await api('/api/sheet/ledger');
  const rows=(d.rows||[]).filter(r=>r['Status']==='written').slice(-50).reverse();
  const em={'🚀 Projects':'🚀','✅ Tasks':'✅','🔓 Open Loops':'🔓','👤 Identity':'👤','🎯 Goals':'🎯','👥 People':'👥','📥 Inbox':'📥','🧠 Beliefs':'🧠','💡 Preferences':'💡'};
  if(!rows.length){document.getElementById('timeline').innerHTML='<div class="sh"><span>Timeline</span></div><div class="empty">No activity yet.</div>';return;}
  let html='<div class="sh"><span>Activity Timeline</span></div><div class="tl">';
  rows.forEach(r=>{
    const sh=r['Sheet']||'';const ico=em[sh]||'📝';
    const ts=(r['Timestamp']||'').substring(0,16).replace('T',' ');
    const rid=r['Row Identifier']||'';
    html+=`<div class="tli"><div class="tl-ts">${ts}</div><div class="tl-body"><div class="tl-ag">${r['Agent']||'?'} -- ${r['Operation']||'?'}</div><div>${ico} ${sh.replace(/^[^\s]+\s*/,'').substring(0,40)}${rid?' -- '+rid.substring(0,40):''}</div></div></div>`;
  });
  html+='</div>';
  document.getElementById('timeline').innerHTML=html;
}

async function loadSecurity(){
  const [q,sl]=await Promise.all([api('/api/sheet/quarantine'),api('/api/sheet/security_log')]);
  const qr=(q.rows||[]).filter(r=>r['Status']==='Quarantined');
  let html='<div class="sh"><span>Security (Raksha)</span></div>';
  html+=`<div style="display:flex;gap:8px;margin-bottom:14px"><button class="btn-p" onclick="scanSec()">Run Full Scan</button><button class="btn" onclick="load('security')">Refresh</button></div>`;
  html+='<div id="scanres" style="margin-bottom:12px"></div>';
  if(!qr.length){html+='<div class="sec-clean">No quarantined writes -- Chitrapat is clean.</div>';}
  else{
    html+='<div class="sh"><span>Quarantined Writes</span></div>';
    qr.forEach(r=>{html+=`<div class="q-item"><div class="q-type">${r['Threat Level']||''} -- ${r['Threat Type']||''}</div><div style="font-size:11px;margin-bottom:6px">${(r['Threats Found']||'').substring(0,80)}</div><div style="display:flex;gap:8px"><button class="btn btn-ok" onclick="releaseQ('${r['Request ID']||''}')">Release (Dharma-Adesh)</button></div></div>`;});
  }
  html+='<div class="sh" style="margin-top:14px"><span>Security Log</span></div>';
  html+=tbl((sl.rows||[]).slice(-15).reverse(),['Timestamp','Agent','Sheet','Threat Level','Status']);
  document.getElementById('security').innerHTML=html;
}

async function loadHealth(){
  const h=await api('/api/health');
  const items=[
    {k:'Status',v:h.status,ok:h.status==='healthy'},
    {k:'Chitragupta',v:h.chitragupta_alive?'alive':'silent',ok:h.chitragupta_alive},
    {k:'VidyaKosha',v:h.vidyakosha,ok:h.vidyakosha==='available'},
    {k:'File Size',v:(h.chitrapat_size_kb||0)+' KB',ok:true},
    {k:'Open Loops',v:h.open_loops||0,ok:(h.open_loops||0)<20},
    {k:'Inbox Pending',v:h.inbox_pending||0,ok:(h.inbox_pending||0)===0},
    {k:'Corrections',v:h.corrections_pending||0,ok:(h.corrections_pending||0)===0},
    {k:'Stale Projects',v:h.stale_projects||0,ok:(h.stale_projects||0)===0},
  ];
  let html='<div class="sh"><span>System Health</span></div><div class="hgrid">';
  html+=items.map(i=>`<div class="hi"><span class="hi-k">${i.k}</span><span class="hi-v ${i.ok?'ok':'warn'}">${i.v}</span></div>`).join('');
  if(h.rows){html+='</div><div class="sh" style="margin-top:14px"><span>Row Counts</span></div><div class="hgrid">';html+=Object.entries(h.rows).map(([s,n])=>`<div class="hi"><span class="hi-k" style="font-size:8px">${s}</span><span class="hi-v">${n}</span></div>`).join('');}
  html+='</div>';
  document.getElementById('health').innerHTML=html;
}

/* Actions */
function goTo(name){
  const tabs=['today','inbox','loops','projects','oracle','review','timeline','security','ledger','health','cognitive_memories','cognitive_hierarchy','cognitive_graph','config_settings'];
  const idx=tabs.indexOf(name);
  if(idx>=0)go(name,document.querySelectorAll('.ntab')[idx]);
}

async function saveInbox(){
  const el=document.getElementById('ii');const t=el.value.trim();if(!t)return;
  const r=await api('/api/inbox',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text:t})});
  if(r.status==='written'){toast('Captured to Inbox');el.value='';await loadInbox();}else toast(r.reason||r.status,false);
}

async function routeAll(){
  const r=await api('/api/inbox/route',{method:'POST'});
  toast(`Routed ${r.routed||0} items`);await loadInbox();if(cur==='today')await loadToday();
}

async function resolveLoop(topic){
  const r=await api(`/api/loops/${encodeURIComponent(topic)}/resolve`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({resolution:'Resolved via Today view'})});
  toast(r.status==='written'?'Loop resolved':'Status: '+r.status);await loadToday();if(cur==='loops')await loadLoops();
}

async function doneTask(task){
  const r=await api('/api/tasks/complete',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({task})});
  toast(r.status==='written'?'Task marked done':'Status: '+r.status);if(cur==='today')await loadToday();
}

async function revC(idx,decision){
  await api('/api/corrections/review',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({index:idx,decision})});
  toast(decision==='Approved'?'Change applied':'Your version kept');await loadReview();
}

async function scanSec(){
  const el=document.getElementById('scanres');el.innerHTML='<span style="color:var(--muted)">Scanning...</span>';
  const r=await api('/api/security/scan',{method:'POST'});
  const t=r.total_findings||0;
  const col=t===0?'var(--green)':(r.confirmed||0)>0?'var(--coral)':'var(--amber)';
  el.innerHTML=`<div style="color:${col};padding:9px;border:1px solid ${col};font-size:11px">${t===0?'Clean -- no threats detected':`${t} findings: ${r.critical||0} critical, ${r.confirmed||0} confirmed, ${r.suspicious||0} suspicious`}</div>`;
  await loadSecurity();
}

async function releaseQ(id){
  const r=await api('/api/security/quarantine/release',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({request_id:id})});
  toast(r.status==='released'?'Released':'Status: '+r.status);await loadSecurity();
}

async function copyCtx(){
  const r=await api('/api/context/copy',{method:'POST'});
  if(r.markdown){try{await navigator.clipboard.writeText(r.markdown);toast('Context copied to clipboard');}catch(e){toast('Context ready (clipboard unavailable)',false);}}
}

/* Float capture */
function floatToggle(){const f=document.getElementById('fform');f.classList.toggle('open');if(f.classList.contains('open'))setTimeout(()=>document.getElementById('finput').focus(),80);}
function floatClose(){document.getElementById('fform').classList.remove('open');}
async function floatSave(){
  const el=document.getElementById('finput');const t=el.value.trim();if(!t)return;
  const r=await api('/api/inbox',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text:t})});
  if(r.status==='written'){toast('Captured');el.value='';floatClose();}else toast('Failed',false);
}

/* Keyboard shortcuts */
document.addEventListener('keydown',e=>{
  if(document.activeElement.tagName==='INPUT'||document.activeElement.tagName==='TEXTAREA')return;
  if(e.key==='i')floatToggle();
  if(e.key==='Escape')floatClose();
});

function renderMcpClientConfig() {
  const select = document.getElementById('mcp-app-selector');
  if (!select) return;
  const key = select.value;
  const client = mcpClients[key];
  if (!client) return;

  const paths = window.resolvedMcpPaths || {
    python_executable: "/usr/bin/python3",
    mcp_script_path: "/Users/revanthlevaka/openyantra/cognitive_mcp.py",
    chitrapat_path: "/Users/revanthlevaka/openyantra/chitrapat.ods"
  };

  const instrContainer = document.getElementById('mcp-instructions-container');
  if (instrContainer) {
    instrContainer.innerHTML = client.instructions;
  }

  const pathContainer = document.getElementById('mcp-file-path-container');
  const pathCode = document.getElementById('mcp-file-path');
  if (pathContainer && pathCode) {
    if (client.file_path) {
      pathCode.textContent = client.file_path;
      pathContainer.style.display = 'block';
    } else {
      pathContainer.style.display = 'none';
    }
  }

  const codeBlock = document.getElementById('mcp-code-block');
  if (codeBlock) {
    if (client.template) {
      codeBlock.textContent = client.template(paths);
    } else if (client.fields) {
      const renderedFields = client.fields.map(f => {
        const val = typeof f.value === 'function' ? f.value(paths) : f.value;
        return `${f.label}:\n${val}`;
      }).join('\n\n');
      codeBlock.textContent = renderedFields;
    }
  }
}

function copyMcpConfig() {
  const codeBlock = document.getElementById('mcp-code-block');
  if (!codeBlock) return;
  navigator.clipboard.writeText(codeBlock.textContent).then(() => {
    toast('MCP configuration copied to clipboard');
  }).catch(err => {
    console.error('Failed to copy text: ', err);
    toast('Failed to copy config', false);
  });
}

    [style*="font-size:11px"], [style*="font-size: 11px"] { font-size: ${s_m2}px !important; }
    [style*="font-size:10px"], [style*="font-size: 10px"] { font-size: ${s_m3}px !important; }
    [style*="font-size:9px"], [style*="font-size: 9px"] { font-size: ${s_m4}px !important; }
    [style*="font-size:8px"], [style*="font-size: 8px"] { font-size: ${s_m5}px !important; }
  `;
}

async function saveSettings() {
  const d = {
    fontSize: document.getElementById('cfg-fontSize').value,
    aiProvider: document.getElementById('cfg-aiProvider').value,
    aiModelName: document.getElementById('cfg-aiModelName').value,
    localEndpoint: document.getElementById('cfg-localEndpoint').value,
    openaiKey: document.getElementById('cfg-openaiKey').value,
    anthropicKey: document.getElementById('cfg-anthropicKey').value,
    geminiKey: document.getElementById('cfg-geminiKey').value,
    oauthClientId: document.getElementById('cfg-oauthClientId').value,
    oauthClientSecret: document.getElementById('cfg-oauthClientSecret').value
  };

  const r = await api('/api/settings', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(d)
  });

  if (r && r.status === 'ok') {
    toast('Settings saved successfully');
    applyFontSize(d.fontSize);
    currentSettings = r.settings;
  } else {
    toast('Failed to save settings', false);
  }
}

/* Theme & Sidebar */
(function(){
  const root=document.documentElement,mq=window.matchMedia('(prefers-color-scheme:light)');
  function apply(m){
    root.setAttribute('data-theme',m==='auto'?(mq.matches?'light':'dark'):m);
    document.querySelectorAll('.th-btn').forEach(b=>b.classList.toggle('active',b.dataset.mode===m));
    localStorage.setItem('oy-t',m);
    if(typeof renderGraphCanvas === 'function' && cur === 'cognitive_graph') {
      renderGraphCanvas();
    }
  }
  apply(localStorage.getItem('oy-t')||'auto');
  mq.addEventListener('change',()=>{if((localStorage.getItem('oy-t')||'auto')==='auto')apply('auto');});
  document.querySelectorAll('.th-btn').forEach(b=>b.addEventListener('click',()=>apply(b.dataset.mode)));

  // Sidebar Toggling & Persistence
  const body = document.body;
  const isCollapsed = localStorage.getItem('oy-sb-collapsed') === 'true';
  if (isCollapsed) body.classList.add('sidebar-collapsed');

  const toggleBtn = document.getElementById('sidebarToggle');
  if (toggleBtn) {
    toggleBtn.addEventListener('click', () => {
      body.classList.toggle('sidebar-collapsed');
      localStorage.setItem('oy-sb-collapsed', body.classList.contains('sidebar-collapsed'));
      // Redraw cognitive graph if resizing sidebar
      setTimeout(() => {
        if (typeof renderGraphCanvas === 'function' && cur === 'cognitive_graph') {
          renderGraphCanvas();
        }
      }, 300);
    });
  }

  // Load and apply base font size on startup
  api('/api/settings').then(s => {
    if (s && s.fontSize) applyFontSize(s.fontSize);
  }).catch(err => console.error('Failed to pre-load settings:', err));
})();

<script>
// ── Cognitive Memory Explorer ────────────────────────────────────────────────

let allMemories = [];

async function loadCognitiveMemories() {
  const d = await api('/api/cognitive/memories');
  allMemories = d.memories || [];
  
  const pane = document.getElementById('cognitive_memories');
  pane.innerHTML = `
    <div class="sh"><span>Memory Explorer</span></div>
    <div style="display:flex; gap:8px; margin-bottom:14px; flex-wrap:wrap;">
      <input id="memSearchQuery" placeholder="Search key or content..." style="flex:2; background:var(--surface2); border:1px solid var(--border); color:var(--text); padding:8px 12px; font-family:var(--mono); font-size:12px; outline:none;" oninput="filterMemories()"/>
      <select id="memSearchType" style="flex:1; background:var(--surface2); border:1px solid var(--border); color:var(--text); padding:8px 12px; font-family:var(--mono); font-size:12px; outline:none;" onchange="filterMemories()">
        <option value="">All Types</option>
        <option value="decision">Decision</option>
        <option value="fact">Fact</option>
        <option value="context">Context</option>
        <option value="observation">Observation</option>
      </select>
      <input id="memSearchTags" placeholder="Tags (comma separated)..." style="flex:1; background:var(--surface2); border:1px solid var(--border); color:var(--text); padding:8px 12px; font-family:var(--mono); font-size:12px; outline:none;" oninput="filterMemories()"/>
      <button class="btn btn-ok" onclick="openAddMemoryModal()">+ Add Memory</button>
    </div>
    <div id="memoriesTableContainer"></div>
  `;
  renderMemoriesTable(allMemories);
}

function renderMemoriesTable(memories) {
  const container = document.getElementById('memoriesTableContainer');
  if (!container) return;
  if (!memories || !memories.length) {
    container.innerHTML = '<div class="empty">No memories found.</div>';
    return;
  }
  
  let html = '<table>';
  html += '<tr><th>Key</th><th>Type</th><th>Agent</th><th>Content</th><th>Tags</th><th>Timestamp</th><th>Actions</th></tr>';
  
  memories.forEach(m => {
    const key = m.key || '';
    const type = m.type || '';
    const agent = m.agent || '';
    const content = m.content || '';
    const tags = (m.tags || []).map(t => `<span class="badge b-lo" style="margin-right:2px; font-size:8px; padding:1px 4px;">${t}</span>`).join('');
    const ts = (m.timestamp || '').substring(0,16).replace('T',' ');
    const keyEsc = key.replace(/'/g, "\\'");
    
    html += `<tr>
      <td style="font-weight:600; color:var(--amber); max-width:180px; overflow:hidden; text-overflow:ellipsis;" title="${key}">${key}</td>
      <td>${ptag(type)}</td>
      <td>${agent}</td>
      <td title="${content}" style="font-family:var(--sans); font-size:11px; max-width:300px; overflow:hidden; text-overflow:ellipsis;">${content}</td>
      <td>${tags}</td>
      <td style="color:var(--muted); font-size:9px;">${ts}</td>
      <td>
        <button class="btn" style="padding:2px 6px; font-size:8px; margin-right:4px;" onclick="editMemory('${keyEsc}')">Edit</button>
        <button class="btn btn-x" style="padding:2px 6px; font-size:8px;" onclick="deleteMemory('${keyEsc}')">Delete</button>
      </td>
    </tr>`;
  });
  
  html += '</table>';
  container.innerHTML = html;
}

async function filterMemories() {
  const query = document.getElementById('memSearchQuery').value.trim();
  const type = document.getElementById('memSearchType').value;
  const tagsInput = document.getElementById('memSearchTags').value.trim();
  
  let url = `/api/cognitive/memories?1=1`;
  if (query) url += `&query=${encodeURIComponent(query)}`;
  if (type) url += `&type=${encodeURIComponent(type)}`;
  if (tagsInput) url += `&tags=${encodeURIComponent(tagsInput)}`;
  
  const d = await api(url);
  renderMemoriesTable(d.memories || []);
}

function openAddMemoryModal() {
  document.getElementById('memoryModalTitle').textContent = 'Add Memory';
  document.getElementById('memModalIsEdit').value = 'false';
  document.getElementById('memModalKey').value = '';
  document.getElementById('memModalKey').disabled = false;
  document.getElementById('memModalType').value = 'decision';
  document.getElementById('memModalAgent').value = '';
  document.getElementById('memModalTags').value = '';
  document.getElementById('memModalContent').value = '';
  document.getElementById('memoryModal').classList.add('open');
}

function closeMemoryModal() {
  document.getElementById('memoryModal').classList.remove('open');
}

async function saveMemoryFromModal() {
  const isEdit = document.getElementById('memModalIsEdit').value === 'true';
  const key = document.getElementById('memModalKey').value.trim();
  const type = document.getElementById('memModalType').value;
  const agent = document.getElementById('memModalAgent').value.trim();
  const tagsStr = document.getElementById('memModalTags').value.trim();
  const content = document.getElementById('memModalContent').value;
  
  if (!key || !agent) {
    toast('Key and Agent are required', false);
    return;
  }
  
  const tags = tagsStr ? tagsStr.split(',').map(t => t.trim()).filter(t => t) : [];
  
  const res = await api('/api/cognitive/write', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ key, type, agent, content, tags })
  });
  
  if (res.key) {
    toast(isEdit ? 'Memory updated' : 'Memory created');
    closeMemoryModal();
    await loadCognitiveMemories();
  } else {
    toast('Failed to save memory', false);
  }
}

function editMemory(key) {
  const m = allMemories.find(item => item.key.toLowerCase() === key.toLowerCase());
  if (!m) return;
  
  document.getElementById('memoryModalTitle').textContent = 'Edit Memory';
  document.getElementById('memModalIsEdit').value = 'true';
  document.getElementById('memModalKey').value = m.key;
  document.getElementById('memModalKey').disabled = true;
  document.getElementById('memModalType').value = m.type;
  document.getElementById('memModalAgent').value = m.agent;
  document.getElementById('memModalTags').value = (m.tags || []).join(', ');
  document.getElementById('memModalContent').value = m.content || '';
  
  document.getElementById('memoryModal').classList.add('open');
}

async function deleteMemory(key) {
  if (!confirm(`Are you sure you want to delete memory '${key}'?`)) return;
  const res = await api('/api/cognitive/delete', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ key })
  });
  if (res.success) {
    toast('Memory deleted');
    await loadCognitiveMemories();
  } else {
    toast('Delete failed', false);
  }
}

// ── Agent Hierarchy & BFS solver ─────────────────────────────────────────────

let hierarchyData = { agents: [], levels: {}, connections: [] };
let selectedAgent = null;

async function loadCognitiveHierarchy() {
  const res = await api('/api/cognitive/hierarchy');
  hierarchyData = res;
  renderHierarchyMap();
}

function renderHierarchyMap() {
  const container = document.getElementById('cognitive_hierarchy');
  
  let html = `
    <div class="sh" style="display:flex; justify-content:space-between; align-items:center;">
      <span>Reporting Hierarchy (BFS Solved)</span>
      <button class="btn btn-ok" style="font-size:9px; padding:4px 10px;" onclick="openAgentModal()">+ Add Agent</button>
    </div>
    <div style="position:relative; width:100%; min-height:450px; background:var(--surface); border:1px solid var(--border); overflow:hidden; padding: 20px;">
      <svg id="hierarchySvg" style="position:absolute; top:0; left:0; width:100%; height:100%; pointer-events:none; z-index:1;"></svg>
      <div id="hierarchyLevelsContainer" style="display:flex; flex-direction:column; gap:65px; position:relative; z-index:2;"></div>
    </div>
  `;
  container.innerHTML = html;
  
  const levelsContainer = document.getElementById('hierarchyLevelsContainer');
  const levels = hierarchyData.levels || {};
  const agents = hierarchyData.agents || [];
  
  const maxLevel = Math.max(-1, ...Object.values(levels));
  if (maxLevel === -1) {
    levelsContainer.innerHTML = '<div class="empty">No agents in reporting structure yet.</div>';
    return;
  }
  
  for (let l = 0; l <= maxLevel; l++) {
    const levelAgents = agents.filter(a => levels[a] === l);
    if (!levelAgents.length) continue;
    
    const row = document.createElement('div');
    row.className = 'level-row';
    
    levelAgents.forEach(a => {
      const node = document.createElement('div');
      node.className = `agent-node ${selectedAgent === a ? 'selected' : ''}`;
      node.setAttribute('data-agent-name', a);
      
      const parentConn = (hierarchyData.connections || []).find(c => c.to === a);
      const parentName = parentConn ? parentConn.from : 'None (Root)';
      
      node.innerHTML = `
        <div style="font-weight:600; color:var(--text); font-size:12px;">${a}</div>
        <div style="font-size:9px; color:var(--muted); margin-top:2px;">Parent: ${parentName}</div>
      `;
      node.onclick = (e) => {
        e.stopPropagation();
        openAgentSidebar(a);
      };
      row.appendChild(node);
    });
    
    levelsContainer.appendChild(row);
  }
  
  setTimeout(drawHierarchyCurves, 80);
}

function drawHierarchyCurves() {
  const svg = document.getElementById('hierarchySvg');
  if (!svg) return;
  svg.innerHTML = '';
  
  const container = document.getElementById('hierarchyLevelsContainer');
  if (!container) return;
  const containerRect = container.getBoundingClientRect();
  
  svg.style.width = containerRect.width + 'px';
  svg.style.height = containerRect.height + 'px';
  
  const connections = hierarchyData.connections || [];
  connections.forEach(conn => {
    const parentNode = container.querySelector(`.agent-node[data-agent-name="${conn.from}"]`);
    const childNode = container.querySelector(`.agent-node[data-agent-name="${conn.to}"]`);
    if (parentNode && childNode) {
      const pRect = parentNode.getBoundingClientRect();
      const cRect = childNode.getBoundingClientRect();
      
      const x1 = (pRect.left + pRect.right) / 2 - containerRect.left;
      const y1 = pRect.bottom - containerRect.top;
      const x2 = (cRect.left + cRect.right) / 2 - containerRect.left;
      const y2 = cRect.top - containerRect.top;
      
      const controlY = y1 + (y2 - y1) * 0.55;
      const d = `M ${x1} ${y1} C ${x1} ${controlY}, ${x2} ${controlY}, ${x2} ${y2}`;
      
      const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      path.setAttribute('d', d);
      path.setAttribute('stroke', 'var(--blue)');
      path.setAttribute('stroke-width', '1.5');
      path.setAttribute('fill', 'none');
      path.setAttribute('opacity', '0.4');
      svg.appendChild(path);
    }
  });
}

window.addEventListener('resize', () => {
  if (cur === 'cognitive_hierarchy') {
    drawHierarchyCurves();
  }
});

function openAgentModal() {
  const select = document.getElementById('agentModalParent');
  select.innerHTML = '<option value="">None (Root)</option>' + 
    hierarchyData.agents.map(a => `<option value="${a}">${a}</option>`).join('');
  
  document.getElementById('agentModalName').value = '';
  document.getElementById('agentModalPrompt').value = '';
  document.getElementById('agentModal').classList.add('open');
}

function closeAgentModal() {
  document.getElementById('agentModal').classList.remove('open');
}

async function saveNewAgent() {

async function saveAgentProfile() {
  if (!selectedAgent) return;

      key,

    })

  if (res.key) {
    toast('System prompt saved');
    closeAgentSidebar();
    await loadCognitiveHierarchy();
  } else {
    toast('Failed to save prompt', false);
  }

// ── Cognitive Force-Directed Graph ───────────────────────────────────────────

let graphCanvas = null;
let graphCtx = null;
let graphNodes = [];
let graphEdges = [];
let graphAnimationId = null;
let draggedNode = null;

async function loadCognitiveGraph() {
  const container = document.getElementById('cognitive_graph');
  
  container.innerHTML = `
    <div class="sh"><span>Conceptual Cognitive Graph</span></div>
    <p style="font-family:var(--sans); font-size:12px; color:var(--text-dim); margin-bottom:12px;">Interactive force-directed simulation. Nodes represent Agents (blue), Memory Documents (coral), and Tags (amber). Drag to interact.</p>
    <div style="background:var(--surface); border:1px solid var(--border); width:100%; height:550px; position:relative; overflow:hidden;">
      <canvas id="graphCanvas" style="display:block; width:100%; height:100%;"></canvas>
    </div>
  `;
  
  graphCanvas = document.getElementById('graphCanvas');
  graphCtx = graphCanvas.getContext('2d');
  
  const rect = graphCanvas.parentElement.getBoundingClientRect();
  graphCanvas.width = rect.width;
  graphCanvas.height = rect.height;
  
  const [memoriesRes, hierarchyRes] = await Promise.all([
    api('/api/cognitive/memories'),
    api('/api/cognitive/hierarchy')
  ]);
  
  const memories = memoriesRes.memories || [];
  const agents = hierarchyRes.agents || [];
  
  buildGraphElements(memories, agents);
  setupGraphEvents();
  
  if (graphAnimationId) cancelAnimationFrame(graphAnimationId);
  graphAnimationId = requestAnimationFrame(simulateGraphPhysics);
}

function buildGraphElements(memories, agents) {
  graphNodes = [];
  graphEdges = [];
  
  const width = graphCanvas.width;
  const height = graphCanvas.height;
  const addedNodes = new Set();
  
  agents.forEach(a => {
    const id = `agent:${a}`;
    if (!addedNodes.has(id)) {
      graphNodes.push({
        id,
        label: a,
        type: 'agent',
        x: width/2 + (Math.random() - 0.5) * 120,
        y: height/2 + (Math.random() - 0.5) * 120,
        vx: 0,
        vy: 0,
        radius: 25
      });
      addedNodes.add(id);
    }
  });
  
  memories.forEach(m => {
    if (m.key === 'agent-hierarchy-connections') return;
    
    const docId = `doc:${m.key}`;
    if (!addedNodes.has(docId)) {
      graphNodes.push({
        id: docId,
        label: m.key,
        type: 'doc',
        x: width/2 + (Math.random() - 0.5) * 220,
        y: height/2 + (Math.random() - 0.5) * 220,
        vx: 0,
        vy: 0,
        radius: 16
      });
      addedNodes.add(docId);
    }
    
    const authorAgentId = `agent:${m.agent}`;
    if (addedNodes.has(authorAgentId)) {
      graphEdges.push({ from: docId, to: authorAgentId });
    }
    
    (m.tags || []).forEach(t => {
      const tagId = `tag:${t}`;
      if (!addedNodes.has(tagId)) {
        graphNodes.push({
          id: tagId,
          label: t,
          type: 'tag',
          x: width/2 + (Math.random() - 0.5) * 280,
          y: height/2 + (Math.random() - 0.5) * 280,
          vx: 0,
          vy: 0,
          radius: 12
        });
        addedNodes.add(tagId);
      }
      
      graphEdges.push({ from: docId, to: tagId });
    });
  });
}

function setupGraphEvents() {
  graphCanvas.addEventListener('mousedown', e => {
    const rect = graphCanvas.getBoundingClientRect();
    const mx = e.clientX - rect.left;
    const my = e.clientY - rect.top;
    
    draggedNode = graphNodes.find(n => {
      const dx = n.x - mx;
      const dy = n.y - my;
      return Math.sqrt(dx*dx + dy*dy) < n.radius + 5;
    });
  });
  
  graphCanvas.addEventListener('mousemove', e => {
    if (draggedNode) {
      const rect = graphCanvas.getBoundingClientRect();
      draggedNode.x = e.clientX - rect.left;
      draggedNode.y = e.clientY - rect.top;
    }
  });
  
  const endDrag = () => { draggedNode = null; };
  graphCanvas.addEventListener('mouseup', endDrag);
  graphCanvas.addEventListener('mouseleave', endDrag);
}

function simulateGraphPhysics() {
  if (cur !== 'cognitive_graph') return;
  
  const width = graphCanvas.width;
  const height = graphCanvas.height;
  
  const kRep = 500;
  const kAtt = 0.035;
  const restLength = 85;
  const gravity = 0.015;
  const friction = 0.85;
  
  for (let i = 0; i < graphNodes.length; i++) {
    const u = graphNodes[i];
    for (let j = i + 1; j < graphNodes.length; j++) {
      const v = graphNodes[j];
      const dx = v.x - u.x;
      const dy = v.y - u.y;
      const dist = Math.sqrt(dx * dx + dy * dy) || 1;
      
      if (dist < 350) {
        const force = kRep / (dist * dist);
        const fx = (dx / dist) * force;
        const fy = (dy / dist) * force;
        
        u.vx -= fx;
        u.vy -= fy;
        v.vx += fx;
        v.vy += fy;
      }
    }
  }
  
  graphEdges.forEach(edge => {
    const u = graphNodes.find(n => n.id === edge.from);
    const v = graphNodes.find(n => n.id === edge.to);
    if (u && v) {
      const dx = v.x - u.x;
      const dy = v.y - u.y;
      const dist = Math.sqrt(dx * dx + dy * dy) || 1;
      const delta = dist - restLength;
      const force = delta * kAtt;
      const fx = (dx / dist) * force;
      const fy = (dy / dist) * force;
      
      u.vx += fx;
      u.vy += fy;
      v.vx -= fx;
      v.vy -= fy;
    }
  });
  
  const cx = width / 2;
  const cy = height / 2;
  
  graphNodes.forEach(node => {
    if (node === draggedNode) {
      node.vx = 0;
      node.vy = 0;
      return;
    }
    
    node.vx += (cx - node.x) * gravity;
    node.vy += (cy - node.y) * gravity;
    
    node.x += node.vx;
    node.y += node.vy;
    
    node.vx *= friction;
    node.vy *= friction;
    
    node.x = Math.max(node.radius, Math.min(width - node.radius, node.x));
    node.y = Math.max(node.radius, Math.min(height - node.radius, node.y));
  });
  
  for (let i = 0; i < graphNodes.length; i++) {
    const u = graphNodes[i];
    for (let j = i + 1; j < graphNodes.length; j++) {
      const v = graphNodes[j];
      const dx = v.x - u.x;
      const dy = v.y - u.y;
      const dist = Math.sqrt(dx * dx + dy * dy) || 1;
      const minDist = u.radius + v.radius + 15;
      
      if (dist < minDist) {
        const push = (minDist - dist) * 0.5;
        const px = (dx / dist) * push;
        const py = (dy / dist) * push;
        
        if (u !== draggedNode) {
          u.x -= px;
          u.y -= py;
        }
        if (v !== draggedNode) {
          v.x += px;
          v.y += py;
        }
      }
    }
  }
  
  renderGraphCanvas();
  graphAnimationId = requestAnimationFrame(simulateGraphPhysics);
}

function renderGraphCanvas() {
  const isLight = document.documentElement.getAttribute('data-theme') === 'light';
  graphCtx.clearRect(0, 0, graphCanvas.width, graphCanvas.height);
  
  graphCtx.strokeStyle = isLight ? 'rgba(0,0,0,0.12)' : 'rgba(255,255,255,0.06)';
  graphCtx.lineWidth = 1.2;
  graphEdges.forEach(edge => {
    const u = graphNodes.find(n => n.id === edge.from);
    const v = graphNodes.find(n => n.id === edge.to);
    if (u && v) {
      graphCtx.beginPath();
      graphCtx.moveTo(u.x, u.y);
      graphCtx.lineTo(v.x, v.y);
      graphCtx.stroke();
    }
  });
  
  graphNodes.forEach(node => {
    graphCtx.beginPath();
    graphCtx.arc(node.x, node.y, node.radius, 0, Math.PI * 2);
    
    if (node.type === 'agent') {
      graphCtx.fillStyle = '#1c6fff';
      graphCtx.strokeStyle = isLight ? 'rgba(0,0,0,0.2)' : 'rgba(255,255,255,0.25)';
    } else if (node.type === 'doc') {
      graphCtx.fillStyle = '#e84520';
      graphCtx.strokeStyle = isLight ? 'rgba(0,0,0,0.15)' : 'rgba(255,255,255,0.18)';
    } else {
      graphCtx.fillStyle = '#f5a000';
      graphCtx.strokeStyle = isLight ? 'rgba(0,0,0,0.15)' : 'rgba(255,255,255,0.18)';
    }
    
    graphCtx.lineWidth = 1.5;
    graphCtx.fill();
    graphCtx.stroke();
    
    graphCtx.fillStyle = '#ffffff';
    graphCtx.font = node.type === 'agent' ? 'bold 9px monospace' : '8px monospace';
    graphCtx.textAlign = 'center';
    graphCtx.textBaseline = 'middle';
    
    const labelLimit = node.type === 'agent' ? 9 : 6;
    let text = node.label;
    if (text.length > labelLimit) {
      text = text.substring(0, labelLimit) + '..';
    }
    graphCtx.fillText(text, node.x, node.y);
  });
}
